spring:
  application:
    name: Backend_HAS-200
  profiles:
    active: dev
  main:
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: validate #Se deshabilita porque Flyway será el encargado del DDL
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    max-age-segundos: 3600
  jwt:
    secret: ${JWT_SECRET}
    issuer: has200-learning
    access-ttl: 15m
    refresh-ttl: 7d
  guias:
    pasos-por-modulo: 6
  intentos:
    segundos-gracia: 10
